<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLOCKY MINES v1.1.0 - COMMUNITY UPDATE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --gui: #c6c6c6; --btn: #555; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; user-select: none; }
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
        .window { background: var(--gui); border: 4px solid #000; padding: 20px; width: 320px; color: #333; text-align: center; }
        .version-tag { font-size: 12px; color: #555; margin-bottom: 15px; font-weight: bold; }
        .mc-btn { width: 100%; padding: 12px; margin: 8px 0; border: 3px solid #000; background: var(--btn); color: #fff; font-weight: bold; cursor: pointer; }
        .mc-btn.sp { background: #4a752c; }
        input[type="text"] { width: 90%; padding: 8px; margin: 5px 0; border: 2px solid #333; font-family: monospace; box-sizing: border-box; }
        
        #hud { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; z-index: 500; }
        .hotbar-container { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.85); border: 4px solid #555; padding: 4px; }
        .slot { width: 42px; height: 42px; border: 4px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; position: relative; }
        .slot .num-label { font-size: 9px; color: #aaa; }
        .slot .item-name { font-size: 10px; font-weight: bold; }
        .slot.active { border-color: #fff; background: rgba(255,255,255,0.2); }

        #inv-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 5000; }
        .inv-grid { background: var(--gui); border: 4px solid #000; padding: 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .inv-cell { width: 55px; height: 55px; background: #8b8b8b; border: 3px solid #333; color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; }

        #chat-box { position: absolute; top: 10px; left: 10px; width: 260px; height: 150px; background: rgba(0,0,0,0.4); display: none; flex-direction: column; z-index: 2000; pointer-events: none; }
        #chat-log { flex: 1; overflow-y: auto; padding: 5px; color: #fff; font-size: 12px; text-shadow: 1px 1px #000; display: flex; flex-direction: column-reverse; }
        #chat-input { background: rgba(0,0,0,0.8); border: 2px solid #555; color: #fff; padding: 5px; outline: none; pointer-events: auto; display: none; width: calc(100% - 14px); }
        #cross { position: absolute; top: 50%; left: 50%; width: 20px; height: 2px; background: #fff; transform: translate(-50%, -50%); display: none; mix-blend-mode: difference; }
        #cross::after { content:''; position: absolute; top: 50%; left: 50%; width: 2px; height: 20px; background: #fff; transform: translate(-50%, -50%); }
        #peer-id-display { position: absolute; top: 10px; right: 10px; color: #fff; font-size: 11px; background: rgba(0,0,0,0.6); padding: 5px; display: none; }
    </style>
</head>
<body>
    <div id="m-os" class="overlay">
        <div class="window">
            <h1>BLOCKY MINES</h1>
            <div class="version-tag">v1.1.0 THE COMMUNITY UPDATE</div>
            
            <button class="mc-btn sp" onclick="startG(true)">🟢 PLAY SINGLEPLAYER</button>
            <hr style="border: 1px dashed #333; margin: 15px 0; width: 100%;">
            
            <div style="margin-bottom: 10px; text-align: left; font-size: 11px;">
                <label><strong>Your Room ID (Give to friends):</strong></label>
                <input type="text" id="my-id-input" readonly placeholder="Generating Network ID...">
            </div>
            
            <div style="margin-bottom: 15px; text-align: left; font-size: 11px;">
                <label><strong>Connect to Friend's Room ID:</strong></label>
                <input type="text" id="join-id-input" placeholder="Paste 5-letter ID here">
            </div>

            <button class="mc-btn" onclick="startG(false)">🌐 LAUNCH MULTIPLAYER</button>
        </div>
    </div>

    <div id="inv-overlay" onclick="closeBigInv()">
        <div class="inv-grid" onclick="event.stopPropagation()">
            <h3 style="grid-column: span 4; margin: 0; text-align: center; font-size: 14px;">SELECT HOTBAR ITEM</h3>
        </div>
    </div>

    <div id="chat-box">
        <div id="chat-log"></div>
        <input type="text" id="chat-input" placeholder="Press Enter to chat...">
    </div>

    <div id="cross"></div>
    <div id="peer-id-display">Room ID: <span id="room-id-txt">OFFLINE</span></div>
    <div id="hud"><div class="hotbar-container"><div id="hb" style="display:flex;gap:4px"></div><div onclick="openBigInv()" style="color:#fff;padding:10px;cursor:pointer;font-weight:bold;font-size:18px;">...</div></div></div>

    <script>
        let scene, camera, renderer, clock, sun, peer, isOffline = true;
        let connections = {}, remotePlayers = {};
        let moveZ=0, moveX=0, yaw=0, pitch=0, slot=0, gameTime=0, chatOpen=false, invOpen=false;
        let blocks=[], ray=new THREE.Raycaster(), mats={};
        
        const ITEMS=["Grass","Stone","Wood","Leaves","Glass","TNT","Redstone","CmdBlock","Water"];
        const COLOR={Grass:0x5da345,Stone:0x808080,Wood:0x5c4033,Leaves:0x3a5e2c,Glass:0xadd8e6,TNT:0xff2222,Redstone:0x990000,CmdBlock:0x8e6f51,Water:0x1d4ece,PlayerSkin:0x3aa89b};

        try {
            const shortId = Math.random().toString(36).substring(2, 7).toUpperCase();
            peer = new Peer("BM-" + shortId);
            peer.on('open', (id) => {
                document.getElementById('my-id-input').value = shortId;
                document.getElementById('room-id-txt').innerText = shortId;
            });
            peer.on('connection', (conn) => { if(!isOffline) setupConnectionData(conn); });
        } catch(e) { console.log("Network discovery failed, fallback running."); }

        function startG(offlineMode) { 
            isOffline = offlineMode;
            document.getElementById('m-os').style.display='none'; 
            document.getElementById('hud').style.display='block';
            document.getElementById('chat-box').style.display='flex';
            document.getElementById('cross').style.display='block';
            
            if(!isOffline) document.getElementById('peer-id-display').style.display='block';
            
            for(let k in COLOR) {
                mats[k] = new THREE.MeshStandardMaterial({ map: tex(COLOR[k]), roughness: 0.85, transparent: (k==="Water"||k==="Glass"), opacity: 0.6 });
            }
            init();

            if(!isOffline) {
                const targetId = document.getElementById('join-id-input').value.trim().toUpperCase();
                if(targetId) {
                    let conn = peer.connect("BM-" + targetId);
                    setupConnectionData(conn);
                }
                addMsg("System", "Multiplayer Mode Enabled.");
            } else {
                addMsg("System", "Singleplayer Offline Mode Enabled.");
            }
        }

        function setupConnectionData(conn) {
            connections[conn.peer] = conn;
            conn.on('data', (data) => {
                if(data.type === 'move') {
                    if(!remotePlayers[conn.peer]) {
                        remotePlayers[conn.peer] = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3, 1.5), mats.PlayerSkin);
                        scene.add(remotePlayers[conn.peer]);
                    }
                    remotePlayers[conn.peer].position.set(data.x, data.y, data.z);
                    remotePlayers[conn.peer].rotation.y = data.yaw;
                }
                if(data.type === 'chat') { addMsg(conn.peer.replace("BM-",""), data.text); }
            });
            conn.on('close', () => {
                if(remotePlayers[conn.peer]) { scene.remove(remotePlayers[conn.peer]); delete remotePlayers[conn.peer]; }
                delete connections[conn.peer];
                addMsg("Server", "Player disconnected.");
            });
        }

        function broadcast(packet) {
            if(isOffline) return;
            Object.values(connections).forEach(conn => { if(conn.open) conn.send(packet); });
        }

        function addMsg(user, text) {
            const log = document.getElementById('chat-log');
            const div = document.createElement('div');
            div.innerHTML = `<strong>[${user}]</strong> ${text}`;
            log.prepend(div);
        }

        function toggleChat() {
            chatOpen = !chatOpen;
            const input = document.getElementById('chat-input');
            input.style.display = chatOpen ? 'block' : 'none';
            if(chatOpen) { input.focus(); document.exitPointerLock(); } 
            else { document.body.requestPointerLock(); }
        }

        document.getElementById('chat-input').addEventListener('keydown', e => {
            if(e.key === 'Enter' && e.target.value.trim() !== "") {
                addMsg("You", e.target.value);
                broadcast({ type: 'chat', text: e.target.value });
                e.target.value = "";
                toggleChat();
            }
        });

        function openBigInv() {
            invOpen = true; document.exitPointerLock();
            const container = document.querySelector('.inv-grid');
            container.querySelectorAll('.inv-cell').forEach(c => c.remove());
            ITEMS.forEach(item => {
                const cell = document.createElement('div'); cell.className = 'inv-cell'; cell.innerText = item;
                cell.onclick = () => { ITEMS[slot] = item; drawHB(); closeBigInv(); };
                container.appendChild(cell);
            });
            document.getElementById('inv-overlay').style.display = 'flex';
        }
        function closeBigInv() { invOpen = false; document.getElementById('inv-overlay').style.display = 'none'; }

        function tex(c) {
            const cv=document.createElement('canvas'); cv.width=16; cv.height=16; const cx=cv.getContext('2d');
            cx.fillStyle='#'+c.toString(16).padStart(6,'0'); cx.fillRect(0,0,16,16);
            return new THREE.CanvasTexture(cv);
        }

        function init() {
            scene=new THREE.Scene(); camera=new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer=new THREE.WebGLRenderer({antialias:false, logarithmicDepthBuffer: true}); 
            renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(renderer.domElement);

            scene.fog=new THREE.FogExp2(0x87CEEB, 0.006); 
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.5));
            sun=new THREE.DirectionalLight(0xfffdf0, 0.8); sun.position.set(50, 100, 30); scene.add(sun); 
            clock=new THREE.Clock();

            for(let x=-24;x<=24;x+=2) {
                for(let z=-24;z<=24;z+=2) {
                    let h=Math.floor(Math.sin(x/12)*Math.cos(z/12)*4);
                    for(let y=-4;y<=h;y+=2) { addB(x,y,z,y===h?"Grass":"Stone"); }
                }
            }
            camera.position.set(0, 12, 0); drawHB(); bind(); loop();
        }

        function addB(x,y,z,t) {
            const b=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),mats[t]);
            b.position.set(x,y,z); b.name=t; scene.add(b); blocks.push(b); return b;
        }

        function bind() {
            window.onkeydown=e=>{
                if(e.code==='KeyT' && !chatOpen) { e.preventDefault(); toggleChat(); return; }
                if(chatOpen || invOpen) return;
                if(e.code==='KeyW')moveZ=-0.3; if(e.code==='KeyS')moveZ=0.3; if(e.code==='KeyA')moveX=-0.3; if(e.code==='KeyD')moveX=0.3;
                if(e.code.startsWith('Digit')){slot=Math.min(parseInt(e.code.slice(-1))-1, 7); drawHB();}
            };
            window.onkeyup=()=> { moveZ=moveX=0; };
            document.onmousedown=e=>{
                if(chatOpen || invOpen) return;
                ray.setFromCamera(new THREE.Vector2(0,0),camera); const h=ray.intersectObjects(blocks);
                if(h.length>0){
                    if(e.button===0){ scene.remove(h[0].object); blocks=blocks.filter(b=>b!==h[0].object); }
                    else { const p=h[0].object.position, n=h[0].face.normal; addB(p.x+n.x*2,p.y+n.y*2,p.z+n.z*2,ITEMS[slot]); }
                }
            };
            document.body.onclick=()=> { if(!chatOpen && !invOpen) document.body.requestPointerLock(); };
            
            document.onmousemove=e=>{
                if(document.pointerLockElement && !chatOpen && !invOpen){
                    yaw -= e.movementX * 0.0025; 
                    pitch -= e.movementY * 0.0025; 
                    pitch = Math.max(-1.45, Math.min(1.45, pitch));
                }
            };
        }

        function drawHB() {
            const h=document.getElementById('hb'); h.innerHTML='';
            ITEMS.forEach((it,i)=>{ if(i < 8) { h.innerHTML+=`<div class="slot ${i===slot?'active':''}" onclick="slot=${i};drawHB()"><span class="item-name">${it.slice(0,3)}</span><span class="num-label">${i+1}</span></div>`; } });
        }

        let emitTimer = 0;
        function loop() {
            requestAnimationFrame(loop); const dt=clock.getDelta(); gameTime+=dt; emitTimer+=dt;
            if (!chatOpen && !invOpen) { camera.rotation.set(pitch,yaw,0,'YXZ'); camera.translateZ(moveZ); camera.translateX(moveX); }
            renderer.render(scene, camera);

            if(!isOffline && emitTimer > 0.04) {
                broadcast({ type: 'move', x: camera.position.x, y: camera.position.y, z: camera.position.z, yaw: yaw });
                emitTimer = 0;
            }
        }
    </script>
</body>
</html>
